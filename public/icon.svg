    <!-- Belt accent cutout (if on dark bg) -->
    <rect x="236" y="318" width="40" height="8" rx="3" fill="#0D1113"/>

    <!-- Powerful Legs in Athletic Stance -->
    <!-- Left Leg -->
    <path d="M 242 338 L 204 430 L 160 456" 
          fill="none" stroke="#CCFF00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Leg -->
    <path d="M 270 338 L 308 430 L 352 456" 
          fill="none" stroke="#CCFF00" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floor Platform / Ground Line -->
    <rect x="130" y="470" width="252" height="14" rx="7" fill="#CCFF00"/>
  </svg>