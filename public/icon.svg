<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <rect width="512" height="512" fill="#0D1113" rx="64"/>
    <!-- Barbell Bar -->
    <rect x="56" y="96" width="400" height="18" rx="9" fill="#CCFF00"/>
    
    <!-- Outer Plates -->
    <rect x="42" y="52" width="24" height="106" rx="6" fill="#CCFF00"/>
    <rect x="72" y="66" width="20" height="78" rx="5" fill="#CCFF00"/>
    
    <rect x="446" y="52" width="24" height="106" rx="6" fill="#CCFF00"/>
    <rect x="420" y="66" width="20" height="78" rx="5" fill="#CCFF00"/>
    
    <!-- Inner Collars -->
    <rect x="96" y="91" width="10" height="28" rx="3" fill="#CCFF00"/>
    <rect x="406" y="91" width="10" height="28" rx="3" fill="#CCFF00"/>

    <!-- Head -->
    <circle cx="256" cy="180" r="32" fill="#CCFF00"/>

    <!-- Arms locked overhead in V-grip -->
    <path d="M 170 114 L 224 230 L 256 250 L 288 230 L 342 114" 
          fill="none" stroke="#CCFF00" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Torso / Core -->
